<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل - RecipeVault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🍲 RecipeVault</div>
    <nav>
      <a href="dashboard.html">الرئيسية</a>
      <a href="add-recipe.html">إضافة وصفة</a>
      <a href="contact.html">تواصل</a>
      <a href="#" id="logoutBtn">تسجيل خروج</a>
    </nav>
  </header>

  <main class="container">
    <h2>📩 تواصل معنا</h2>
    <form id="contactForm" class="contact-form">
      <div class="input-group">
        <label for="contactName">الاسم</label>
        <input type="text" id="contactName" placeholder="اسمك" required>
      </div>
      <div class="input-group">
        <label for="contactEmail">البريد الإلكتروني</label>
        <input type="email" id="contactEmail" placeholder="بريدك@example.com" required>
      </div>
      <div class="input-group">
        <label for="contactMessage">الرسالة</label>
        <textarea id="contactMessage" rows="5" placeholder="اكتب رسالتك..." required></textarea>
      </div>
      <button type="submit" class="btn-primary">إرسال</button>
      <div id="contactMessageStatus" class="success-message"></div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
