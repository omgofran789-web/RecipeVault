<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - RecipeVault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="login-box">
      <h1>🍲 RecipeVault</h1>
      <h2>تسجيل الدخول</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
        </div>
        <div class="input-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="btn-primary">دخول</button>
        <div id="loginError" class="error-message"></div>
      </form>
      <p class="hint">(للاختبار: اسم المستخدم `admin`، كلمة المرور `123`)</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
